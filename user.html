<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Feedback</title>
    <link rel="icon" href="logo.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #F9F7F2;
            color: #333333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 4px 20px rgba(124, 78, 44, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
            padding: 20px;
            background: #F9F7F2;
            border-radius: 16px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 700;
            color: #7C4E2C;
            letter-spacing: -0.5px;
        }

        .logo-subtext {
            font-size: 14px;
            color: #D4A373;
            margin-top: 4px;
            font-weight: 500;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #7C4E2C;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: rgba(51, 51, 51, 0.7);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .rating-section {
            margin-bottom: 24px;
        }

        .category {
            margin-bottom: 24px;
        }

        .category-label {
            font-size: 16px;
            font-weight: 500;
            color: #7C4E2C;
            margin-bottom: 12px;
            display: block;
        }

        .stars {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .star {
            width: 44px;
            height: 44px;
            cursor: pointer;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #D4A373;
            transition: all 0.2s ease;
            user-select: none;
        }

        .star:hover {
            transform: scale(1.15);
            color: #7C4E2C;
        }

        .star.selected {
            color: #7C4E2C;
        }

        .feedback-box {
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: 500;
            color: #7C4E2C;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #D4A373;
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            color: #333333;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #7C4E2C;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #7C4E2C;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(124, 78, 44, 0.2);
        }

        .submit-btn:hover {
            background: #5F3A21;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(124, 78, 44, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .success-message {
            display: none;
            background: #E8F3E8;
            color: #2E5D2E;
            padding: 16px;
            border-radius: 14px;
            text-align: center;
            margin-top: 20px;
            font-weight: 500;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .thank-you-page {
            display: none;
            text-align: center;
            padding: 60px 24px;
        }

        .thank-you-page.show {
            display: block;
        }

        .thank-you-icon {
            font-size: 80px;
            margin-bottom: 24px;
            animation: bounce 0.6s ease;
        }

        .thank-you-page h1 {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .thank-you-page p {
            font-size: 18px;
            color: rgba(51, 51, 51, 0.7);
            margin-bottom: 32px;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #7C4E2C;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }

        .back-btn:hover {
            background: #5F3A21;
            transform: translateY(-1px);
        }

        @keyframes bounce {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 20px;
            }

            .stars {
                gap: 6px;
            }

            .star {
                width: 40px;
                height: 40px;
                font-size: 28px;
            }

            .thank-you-page {
                padding: 40px 24px;
            }

            .thank-you-icon {
                font-size: 60px;
            }

            .thank-you-page h1 {
                font-size: 24px;
            }

            .thank-you-page p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="feedbackFormContainer">
            <div class="logo">
                <img src="logo.jpg" alt="Windowpane Cafe Logo" width="200">
            </div>

            <h1>Share Your Experience</h1>
            <p class="subtitle">Your feedback helps us serve you better</p>

            <form id="feedbackForm">
                <div class="rating-section">
                    <div class="category">
                        <label class="category-label">Food Quality</label>
                        <div class="stars" data-category="food">
                            <div class="star" data-value="1">★</div>
                            <div class="star" data-value="2">★</div>
                            <div class="star" data-value="3">★</div>
                            <div class="star" data-value="4">★</div>
                            <div class="star" data-value="5">★</div>
                        </div>
                    </div>

                    <div class="category">
                        <label class="category-label">Service</label>
                        <div class="stars" data-category="service">
                            <div class="star" data-value="1">★</div>
                            <div class="star" data-value="2">★</div>
                            <div class="star" data-value="3">★</div>
                            <div class="star" data-value="4">★</div>
                            <div class="star" data-value="5">★</div>
                        </div>
                    </div>

                    <div class="category">
                        <label class="category-label">Ambiance</label>
                        <div class="stars" data-category="ambiance">
                            <div class="star" data-value="1">★</div>
                            <div class="star" data-value="2">★</div>
                            <div class="star" data-value="3">★</div>
                            <div class="star" data-value="4">★</div>
                            <div class="star" data-value="5">★</div>
                        </div>
                    </div>

                    <div class="category">
                        <label class="category-label">Cleanliness</label>
                        <div class="stars" data-category="cleanliness">
                            <div class="star" data-value="1">★</div>
                            <div class="star" data-value="2">★</div>
                            <div class="star" data-value="3">★</div>
                            <div class="star" data-value="4">★</div>
                            <div class="star" data-value="5">★</div>
                        </div>
                    </div>
                </div>

                <div class="feedback-box">
                    <label for="comments">Additional Feedback</label>
                    <textarea id="comments" name="comments"
                        placeholder="Tell us more about your experience..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Feedback</button>
            </form>
        </div>

        <div class="thank-you-page" id="thankYouPage">
            <div class="thank-you-icon">✓</div>
            <h1>Thank You for Your Feedback!</h1>
            <p>We appreciate your time and your valuable input.</p>
        </div>
    </div>

    <script>
        // Star rating functionality
        const ratings = {
            food: 0,
            service: 0,
            ambiance: 0,
            cleanliness: 0
        };

        document.querySelectorAll('.stars').forEach(starContainer => {
            const category = starContainer.dataset.category;
            const stars = starContainer.querySelectorAll('.star');

            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const value = parseInt(star.dataset.value);
                    ratings[category] = value;

                    // Update visual state
                    stars.forEach(s => {
                        const starValue = parseInt(s.dataset.value);
                        if (starValue <= value) {
                            s.classList.add('selected');
                        } else {
                            s.classList.remove('selected');
                        }
                    });
                });
            });
        });

        // Form submission
        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const comments = document.getElementById('comments').value;
            const submitBtn = document.querySelector('.submit-btn');
            const formContainer = document.getElementById('feedbackFormContainer');
            const thankYouPage = document.getElementById('thankYouPage');

            // Disable submit button and show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            // Prepare entry with timestamp (date + time)
            const now = new Date();
            const entry = {
                ratings: { ...ratings },
                comments,
                timestampISO: now.toISOString(),
                date: now.toLocaleDateString(),
                time: now.toLocaleTimeString()
            };

            // Send to backend API
            try {
                const response = await fetch('http://localhost:8000/submit_feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(entry)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                console.log('Feedback submitted successfully:', result);

                // Hide form and show thank you page
                formContainer.style.display = 'none';
                thankYouPage.classList.add('show');
            } catch (err) {
                console.error('Failed to submit feedback:', err);
                alert('Failed to submit feedback. Please ensure the backend server is running and try again.');

                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Feedback';
            }
        });
    </script>
</body>

</html>
